<script>
const $=s=>document.querySelector(s);
const K='tapchart.v1';
const blank={onboarded:false,basics:{name:'',dob:'',blood:'',phone:'',contact:''},allergies:[],medicines:[],conditions:[],surgeries:[],sensitive:[],log:[],checkins:[]};
let MEM=null;const ls={get(){try{return localStorage.getItem(K)}catch(e){return MEM}},set(v){try{localStorage.setItem(K,v)}catch(e){MEM=v}},del(){try{localStorage.removeItem(K)}catch(e){}MEM=null}};
const load=()=>{try{return JSON.parse(ls.get()||'{}')}catch(e){return {}}};
let S=Object.assign(structuredClone(blank),load());
const save=()=>ls.set(JSON.stringify(S));
window.addEventListener('storage',()=>{S=Object.assign(structuredClone(blank),load());render()});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CLINICS=[{id:'c1',name:'Greenleaf Family Clinic',city:'Pune',ver:1},{id:'c2',name:'Smile Care Dental',city:'Pune',ver:1},{id:'c3',name:'Clear Vision Eye Centre',city:'Pune',ver:1}];
const PRESETS={
 general:{n:'General visit',keys:['basics','allergies','medicines','conditions']},
 dental:{n:'Dentist',keys:['basics','allergies','medicines']},
 eye:{n:'Eye doctor',keys:['basics','allergies','conditions']},
 emergency:{n:'Emergency',keys:['basics','allergies','medicines','conditions','surgeries']},
 minimal:{n:'Just my name',keys:['basics']}};
const CAT={basics:'Basics (name, age, blood group)',allergies:'Allergies',medicines:'Current medicines',conditions:'Medical conditions',surgeries:'Past surgeries',sensitive:'Sensitive: mental, reproductive, sexual health, infections'};
// ---- data items per category
function items0(k){
 const b=S.basics;
 if(k=='basics'){const a=[];if(b.name)a.push('Name: '+b.name);if(b.dob)a.push('Age: '+age(b.dob)+' (DOB '+b.dob+')');if(b.blood)a.push('Blood group: '+b.blood);if(b.phone)a.push('Phone: '+b.phone);if(b.contact)a.push('Emergency contact: '+b.contact);return a}
 if(k=='medicines')return S.medicines.map(m=>m.name+(m.dose?' - '+m.dose:''));
 return S[k]||[];
}
function age(d){const t=new Date(d);if(isNaN(t))return'?';return Math.floor((Date.now()-t)/31557600000)}

let ob={step:0},sh={},desk={};
function setNav(r){
 const IC={'home': 'M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z', 'share': 'M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13', 'log': 'M7 3h10a1 1 0 011 1v17l-3-2-3 2-3-2-3 2V4a1 1 0 011-1zM9 8h6M9 12h6', 'desk': 'M3 21V8l9-5 9 5v13M9 21v-6h6v6M12 8v3M10.5 9.5h3'};const sv=k=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k]}"/></svg>`;const t=[['home','home','Home'],['share','share','Share'],['log','log','Access'],['desk','desk','Clinic desk']];
 $('#nav').innerHTML=S.onboarded?t.map(x=>`<a href="#${x[0]}" class="${r.split('/')[0]==x[0]?'on':''}"><span>${sv(x[1])}</span>${x[2]}</a>`).join(''):'';
 $('#mode').textContent=r=='desk'?'Clinic view':'Demo mode';
}
function render(){const r=route();setNav(r);const v=VIEWS[r.split('/')[0]]||VIEWS.home;$('#app').innerHTML=v(r);window.scrollTo(0,0);if(AFTER[r])AFTER[r]()}
window.addEventListener('hashchange',render);

 ${S.vitals&&S.vitals.bp?`<a class=card href="#vitals" style="display:block;text-decoration:none;color:inherit"><div class=row style="padding:0"><b>Vitals</b><span class=mute>30 days</span></div>${sp_(S.vitals.bp.slice(-30).map(x=>x.sys),'#0b0f0e',300,48)}<small class=mute>BP ${S.vitals.bp[89].sys}/${S.vitals.bp[89].dia} · ${S.vitals.steps[89].v.toLocaleString()} steps</small></a>`:''}
 ${sec('basics','Basics')}${sec('allergies','Allergies','w')}${sec('medicines','Medicines')}${sec('conditions','Conditions')}${sec('surgeries','Past surgeries','g')}
 <div class="card sens"><div class=row style="padding-top:0"><b>Sensitive notes</b><button class="sm sec" onclick="edit('sensitive')">Edit</button></div>${S.sensitive.length?S.sensitive.map(x=>`<span class="chip w">${esc(x)}</span>`).join(''):'<p class=mute>Nothing added.</p>'}<p class=mute>Never shared unless you switch it on for a specific visit.</p></div>
 <button class=ghost onclick="if(confirm('Delete all data on this device?')){ls.del();S=structuredClone(blank);location.hash='welcome';render()}">Delete my data</button>`};
const _share=VIEWS.share;
VIEWS.share=(r)=>{if(sh.clinic&&!sh.done){const keys=SHARE_KEYS;const c=CLINICS.find(x=>x.id==sh.clinic);const pk=sh.preset;
 if(sh.bio==1)return `<div class=bio><div class=fp><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#0b0f0e" stroke-width="1.6" stroke-linecap="round"><path d="M12 11v4a3 3 0 01-.6 1.8M8 11a4 4 0 118 0v2.5M5 12a7 7 0 1114 0v1.5c0 2-.4 3.4-1 4.5M8.5 17c.3-1 .5-2 .5-3.5v-2.5"/></svg></div><b>Confirm with fingerprint</b><p class=mute>Demo: confirms automatically</p></div>`;
 return `<h1>Check in</h1><div class=card><b>${c.name}</b> <span class=chip>✔ Verified clinic</span><p class=mute>${c.city}</p></div>
 <h2>Who is this visit with?</h2><div>${Object.entries(PRESETS).map(([k,v])=>`<span class="chip ${pk==k?'':'g'} pre" onclick="setPreset('${k}')">${v.n}</span>`).join('')}</div>
 <h2>This is exactly what they will see</h2><p class=mute>Switch off anything you do not want to share.</p>
 ${keys.map(k=>{const a=items(k);if(!a.length)return '';const on=sh.on[k];return `<div class="card ${k=='sensitive'?'sens':''}"><div class=row style="padding-top:0"><div class=t><b>${CAT[k]}</b></div><label class=sw><input type=checkbox ${on?'checked':''} onchange="tog('${k}',this.checked)"><i></i></label></div>${on?`<div class=open>${a.map(x=>`<p>• ${esc(x)}</p>`).join('')}</div>`:'<p class=mute>Not shared</p>'}</div>`}).join('')}
 <label class=f>Keep it available for</label><select onchange="sh.exp=+this.value"><option value=24 ${sh.exp==24?'selected':''}>24 hours (default)</option><option value=4 ${sh.exp==4?'selected':''}>Until visit ends (4 hours)</option><option value=168 ${sh.exp==168?'selected':''}>7 days</option></select>
 <div class=card><div class=row style="padding:0"><div class=t><b>Allow doctor to send updates back</b><small>Medicine review and visit note. Off by default.</small></div>${sw(sh.wb,"sh.wb=this.checked")}</div></div>
 <div class=banner>You can ask the clinic to delete this any time (Access tab). Copies a clinic already printed or downloaded are outside our control. <a href="#policy" class=lk>Deletion policy</a></div>
 <button onclick="bioConfirm()">Confirm and share</button><button class=ghost onclick="sh={};render()">Cancel</button>`}
 return _share(r)};
function setPreset(k){sh.preset=k;sh.on={};SHARE_KEYS.forEach(c=>sh.on[c]=PRESETS[k].keys.includes(c)&&c!='sensitive');render()}
// Hook: after success, desk bundles + log show

let sp=!S.onboarded&&!location.hash;if(sp){document.body.insertAdjacentHTML('beforeend','<div id=splash><div class="logo big"><i></i><b>TapChart</b></div></div>');setTimeout(()=>{const e=$('#splash');e&&e.remove()},1000)}
render();
</script></body></html>
